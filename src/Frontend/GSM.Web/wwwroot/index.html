<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSM</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/GSM.UI.Shared/gsm.css" />
    <script src="_content/GSM.UI.Shared/gsm-theme.js"></script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Dos apps instalables desde el mismo sitio: la del miembro (/app) y el panel del gym (todo lo demás).
         Cada una con su manifiesto; se elige por la ruta con la que se abre la página. -->
    <script>
        (function () {
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = location.pathname === '/app' || location.pathname.indexOf('/app/') === 0
                ? 'manifest.json'
                : 'manifest-panel.json';
            document.head.appendChild(link);
        })();
    </script>
    <script src="gsm-push.js"></script>
    <script src="gsm-geolocation.js"></script>
    <meta name="theme-color" content="#0F0E0D" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Se ha producido un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>

</html>
