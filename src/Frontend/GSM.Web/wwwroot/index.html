<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrainingHub</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/GSM.UI.Shared/gsm.css" />
    <script src="_content/GSM.UI.Shared/gsm-theme.js"></script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Dos apps instalables desde el mismo sitio: la del miembro (/app) y el panel del gym (todo lo demás).
         Cada una con su manifiesto; se elige por la ruta con la que se abre la página. -->
    <script>
        (function () {
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = location.pathname === '/app' || location.pathname.indexOf('/app/') === 0
                ? 'manifest.json'
                : 'manifest-panel.json';
            document.head.appendChild(link);
        })();
    </script>
    <script src="gsm-push.js"></script>
    <script src="gsm-geolocation.js"></script>
    <meta name="theme-color" content="#0F0E0D" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
    <div class="gsm-boot">
        <span class="gsm-wordmark">TRAINING<span class="accent">HUB</span></span>
        <div class="gsm-loader gsm-loader--boot" role="progressbar" aria-label="Cargando" aria-busy="true">
            <svg viewBox="0 0 240 90" aria-hidden="true" focusable="false">
                <g class="gsm-loader__plates">
                    <rect x="6" y="20" width="17" height="50" rx="4" /><rect x="25" y="12" width="17" height="66" rx="4" />
                    <rect x="198" y="12" width="17" height="66" rx="4" /><rect x="217" y="20" width="17" height="50" rx="4" />
                </g>
                <g class="gsm-loader__shine">
                    <rect x="9" y="23" width="4" height="44" rx="2" /><rect x="28" y="15" width="4" height="60" rx="2" />
                    <rect x="201" y="15" width="4" height="60" rx="2" /><rect x="220" y="23" width="4" height="44" rx="2" />
                </g>
                <g class="gsm-loader__sleeve"><rect x="42" y="34" width="10" height="22" rx="2" /><rect x="188" y="34" width="10" height="22" rx="2" /></g>
                <path class="gsm-loader__bar" d="M52 40 Q120 28 188 40" />
                <path class="gsm-loader__track" d="M52 40 Q120 28 188 40" />
                <path class="gsm-loader__fill gsm-loader__fill--left" pathLength="1" d="M120 34 Q86 34 52 40" />
                <path class="gsm-loader__fill gsm-loader__fill--right" pathLength="1" d="M120 34 Q154 34 188 40" />
            </svg>
        </div>
        <div class="loading-progress-text"></div>
    </div>
    </div>

    <div id="blazor-error-ui">
        Se ha producido un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>

</html>
