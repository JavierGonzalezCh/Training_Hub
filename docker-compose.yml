services:
  postgres:
    image: postgres:16-alpine
    container_name: gsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gsm
      POSTGRES_USER: gsm
      POSTGRES_PASSWORD: gsm
    ports:
      - "5432:5432"
    volumes:
      - gsm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsm -d gsm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gsm-pgdata:
