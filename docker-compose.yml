# TrainingHub (GSM): API + web + tarea periódica. La base de datos NO va aquí: es un Postgres externo
# (DB_CONNECTION). Así redesplegar nunca toca los datos y se administra con DBeaver / pgAdmin por fuera.
#
#   cp .env.example .env        # y rellenar (las claves se generan con: openssl rand -base64 48)
#   docker compose up -d --build
#
# Las migraciones NO se aplican aquí: se ejecutan aparte contra la base (ver README, «Migraciones en producción»).
# La API no migra al arrancar. La primera vez, crear el SuperAdmin (después de migrar):
#   docker compose run --rm api --seed-superadmin
#
# En Dokploy (tipo "Docker Compose") los dominios se asignan en su panel: api -> puerto 8080, web -> puerto 8080.
# Este archivo no publica puertos; para probarlo en local usar además docker-compose.local.yml.
name: gsm

services:
  api:
    build:
      context: ./src/Backend
      dockerfile: GSM.API/Dockerfile
      target: api
    image: gsm-api:${GSM_TAG:-latest}
    restart: unless-stopped
    volumes:
      - dataprotection:/home/app/.aspnet/DataProtection-Keys
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: ${DB_CONNECTION:?Falta DB_CONNECTION (cadena de conexión de Postgres)}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Falta JWT_SIGNING_KEY (>= 32 caracteres)}
      Checkin__SigningKey: ${CHECKIN_SIGNING_KEY:?Falta CHECKIN_SIGNING_KEY (>= 32 caracteres, distinta de la de JWT)}
      Communications__UnsubscribeSigningKey: ${UNSUBSCRIBE_SIGNING_KEY:?Falta UNSUBSCRIBE_SIGNING_KEY}
      Communications__PublicApiBaseUrl: ${PUBLIC_API_URL:?Falta PUBLIC_API_URL (p. ej. https://api.midominio.com)}
      Identity__PublicWebBaseUrl: ${PUBLIC_WEB_URL:?Falta PUBLIC_WEB_URL (p. ej. https://app.midominio.com)}
      Cors__AllowedOrigins__0: ${PUBLIC_WEB_URL}
      Jobs__Secret: ${JOBS_SECRET:?Falta JOBS_SECRET (>= 32 caracteres)}
      # Solo para `docker compose run --rm api --seed-superadmin` (no se usa al servir peticiones).
      Seed__SuperAdmin__Email: ${SUPERADMIN_EMAIL:-}
      Seed__SuperAdmin__Password: ${SUPERADMIN_PASSWORD:-}
      Seed__SuperAdmin__FullName: ${SUPERADMIN_NAME:-Super Admin}
      # Opcionales: sin ellos las subidas de archivo fallan, los correos van al log y no hay push.
      Storage__R2__AccountId: ${R2_ACCOUNT_ID:-}
      Storage__R2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      Storage__R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      Storage__R2__Bucket: ${R2_BUCKET:-}
      Storage__R2__PublicBaseUrl: ${R2_PUBLIC_BASE_URL:-}
      Email__Resend__ApiKey: ${RESEND_API_KEY:-}
      Email__Resend__FromAddress: ${RESEND_FROM_ADDRESS:-}
      Notifications__Fcm__ProjectId: ${FCM_PROJECT_ID:-}
      Notifications__Fcm__ServiceAccountJson: ${FCM_SERVICE_ACCOUNT_JSON:-}
      Notifications__Fcm__Web__ApiKey: ${FCM_WEB_API_KEY:-}
      Notifications__Fcm__Web__AppId: ${FCM_WEB_APP_ID:-}
      Notifications__Fcm__Web__MessagingSenderId: ${FCM_WEB_SENDER_ID:-}
      Notifications__Fcm__Web__VapidKey: ${FCM_WEB_VAPID_KEY:-}

  web:
    build:
      context: ./src/Frontend
      dockerfile: GSM.Web/Dockerfile
    image: gsm-web:${GSM_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      # Se escribe en wwwroot/appsettings.json al arrancar: la misma imagen sirve para cualquier entorno.
      API_BASE_URL: ${PUBLIC_API_URL:?Falta PUBLIC_API_URL}

  # Tarea periódica de Comunicaciones (recordatorios de vencimiento, cola de correos, avisos de suscripción,
  # anonimización y alertas). Llama a la API por la red interna de Docker.
  cron:
    image: curlimages/curl:8.11.1
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      JOBS_SECRET: ${JOBS_SECRET}
      JOBS_INTERVAL_SECONDS: ${JOBS_INTERVAL_SECONDS:-300}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -m 120 -X POST http://api:8080/internal/jobs/communications/run -H "X-Job-Secret: $$JOBS_SECRET" -o /dev/null \
            && echo "tarea periódica OK" || echo "tarea periódica FALLÓ" >&2
          sleep "$$JOBS_INTERVAL_SECONDS"
        done

volumes:
  dataprotection:
