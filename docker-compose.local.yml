# Solo para probar en tu PC: publica la API y la web en puertos locales.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   API: http://localhost:8080   Web: http://localhost:8081
# Con PUBLIC_API_URL=http://localhost:8080 y PUBLIC_WEB_URL=http://localhost:8081 en el .env.
services:
  api:
    ports:
      - "8080:8080"
    # host.docker.internal = el Postgres de tu PC (DB_CONNECTION con Host=host.docker.internal).
    extra_hosts:
      - "host.docker.internal:host-gateway"
  migrate:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  web:
    ports:
      - "8081:8080"
